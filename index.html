<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface-2:#f0ede6; --text:#1d1b18; --muted:#6b665c;
  --line:#e2ddd2; --accent:#b4441f; --accent-soft:#f6e3da; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
  --c-tg:#b4441f; --c-book:#7a4fa3; --c-dict:#2f6f9f; --c-game:#2e8a57; --c-mind:#a0762a;
  --c-fin:#9b2f4d; --c-pol:#3f4f8f; --c-hist:#8a5a2b; --c-write:#3e6db5; --c-lean:#4a7d74; --c-me:#6a6a6a;

:root[data-theme="dark"]{
  --bg:#141311; --surface:#1d1c19; --surface-2:#26241f; --text:#ece8df; --muted:#a19b8f;
  --line:#34312b; --accent:#ec7a50; --accent-soft:#3a2219; --shadow:0 1px 2px rgba(0,0,0,.4);

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.mono{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
.brand b{display:block;font-size:15px;white-space:nowrap}
.brand small{display:block;font-size:12px;color:var(--muted);white-space:nowrap}
.spacer{flex:1}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 10px;white-space:nowrap}
.btn{font:inherit;font-size:13px;background:var(--surface);color:var(--text);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}

/* hero */
.hero{padding:44px 0 20px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.2;margin:8px 0 12px;letter-spacing:-.01em}
.hero p{max-width:760px;color:var(--muted);margin:0}

/* controls */
.controls{position:sticky;top:60px;z-index:15;background:var(--bg);padding:14px 0 12px;border-bottom:1px solid var(--line)}
.search{width:100%;font:inherit;font-size:15px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);outline:none}
.search:focus{border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{font:inherit;font-size:13px;flex:none;border:1px solid var(--line);background:var(--surface);color:var(--text);
  border-radius:99px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip .n{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}

/* sections */
section.grp{padding:34px 0 6px;scroll-margin-top:150px}
.grp-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.grp-no{font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--gc);font-weight:700}
.grp-head h2{margin:0;font-size:22px}
.grp-count{font-size:12px;color:var(--muted);margin-left:auto}
.grp-sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}

.card{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:16px 16px 14px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--gc)}
.card:hover{transform:translateY(-2px);border-color:var(--gc)}
.card .ico{font-size:22px;line-height:1}
.card .tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gc);font-weight:700;margin-top:10px}
.card h3{font-size:16px;margin:4px 0 6px;line-height:1.35}
.card p{font-size:13.5px;color:var(--muted);margin:0 0 14px;flex:1}
.card .acts{display:flex;gap:8px}
.card .open{flex:1;text-align:center;background:var(--gc);color:#fff;border-color:transparent;font-weight:600}
:root[data-theme="dark"] .card .open{color:#141311}
.card .open:hover{filter:brightness(1.08)}
.empty{display:none;text-align:center;color:var(--muted);padding:60px 0}

footer{border-top:1px solid var(--line);margin-top:48px;padding:24px 0 40px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2e8a57;margin-right:6px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--text);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:640px){
  .brand small,.pill{display:none}
  .hero{padding:28px 0 14px}
  .grid{grid-template-columns:1fr}
}
</style>

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let active = "all";

function render(){
  const q = $("#q").value.trim().toLowerCase();
  const match = x => !q || [x.t, x.d, x.tag].join(" ").toLowerCase().includes(q);
  let shown = 0;
  $("#sections").innerHTML = GROUPS.map(g => {
    if (active !== "all" && active !== g.id) return "";
    const items = TOOLS.filter(x => x.g === g.id && match(x));
    if (!items.length) return "";
    shown += items.length;
    return `<section class="grp" id="${g.id}" style="--gc:var(${g.color})">
      <div class="grp-head"><span class="grp-no">${g.no}</span><h2>${g.title}</h2>
        <span class="grp-count">${g.en} · ${items.length} Tools</span></div>
      <p class="grp-sub">${g.sub}</p>
      <div class="grid">${items.map(x => {
        const url = B + x.u;
        return `<article class="card"><span class="ico">${x.ico}</span>
          <div class="tag">${esc(x.tag)}</div><h3>${esc(x.t)}</h3><p>${esc(x.d)}</p>
          <div class="acts"><a class="btn open" href="${url}" target="_blank" rel="noopener">開啟站台 ↗</a>
          <button class="btn copy" type="button" data-url="${url}">複製網址</button></div></article>`;
      }).join("")}</div></section>`;
  }).join("");
  $("#empty").style.display = shown ? "none" : "block";
}

function chips(){
  const all = [{id:"all", title:"全部"}].concat(GROUPS);
  $("#chips").innerHTML = all.map(g => {
    const n = g.id === "all" ? TOOLS.length : TOOLS.filter(x => x.g === g.id).length;
    return `<button class="chip" type="button" data-g="${g.id}" aria-pressed="${g.id === active}">${g.title}<span class="n">${n}</span></button>`;
  }).join("");
}

$("#chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  active = b.dataset.g; chips(); render();
});
$("#q").addEventListener("input", render);
$("#sections").addEventListener("click", async e => {
  const b = e.target.closest(".copy"); if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.url); } catch { prompt("複製網址：", b.dataset.url); return; }
  const t = $("#toast"); t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1600);
});

// theme
const root = document.documentElement;
function setTheme(m){ root.dataset.theme = m; $("#theme").textContent = m === "dark" ? "☀️" : "🌙";
  try { localStorage.setItem("theme", m); } catch {} }
let saved = null; try { saved = localStorage.getItem("theme"); } catch {}
setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
$("#theme").addEventListener("click", () => setTheme(root.dataset.theme === "dark" ? "light" : "dark"));

$("#total").textContent = `${TOOLS.length} 項`;
$("#active").textContent = `${TOOLS.length} Tools Active`;
chips(); render();
</script>
</body>
</html>
